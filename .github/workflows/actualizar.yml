name: Actualizar Hechos BVL

on:
  schedule:
    - cron: '30 13 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Ejecutar scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/scrape.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "hechos-bvl-bot"
          git config user.email "actions@github.com"
          git add data/hechos.json
          git diff --staged --quiet || git commit -m "Actualización automática de Hechos de Importancia"
          git push
